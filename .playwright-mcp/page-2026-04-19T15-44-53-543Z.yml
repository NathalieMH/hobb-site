            - text: “The Benson Is
            - text: Pure New York
          - generic [ref=e59]:
            - paragraph [ref=e60]: Its design is a long-awaited tribute to the architectural legacy of the Upper East Side. Handlaid limestone, distinctive mullioned windows, and a series of set-back terraces detailed with intricate ironwork all come together to create a sense of romantic verticality on Madison Avenue.”
            - paragraph [ref=e61]: Peter Pennoyer
            - paragraph [ref=e62]: Architecture & Interior Design
        - img [ref=e65]
      - generic [ref=e75]:
        - heading "A Stately Classical Arrival" [level=2] [ref=e76]:
          - text: A Stately
          - text: Classical
          - text: Arrival
        - paragraph [ref=e77]: The stately classical arrival, with sculpted Indiana limestone and detailed iron double-set doors, encloses a divinely detailed jewel box lobby. Sophisticated and intimate, the arrival embodies the heart and soul of the Upper East Side.
      - generic [ref=e86]:
        - heading "Lobby By Achille Salvagni" [level=2] [ref=e87]:
          - text: Lobby By
          - text: Achille Salvagni
        - generic [ref=e88]:
          - paragraph [ref=e89]: “I wanted to craft a jewel of a space that raises one's sense of expectations. The focus is to create drama in the arrival experience, creating an alluring progression of spaces. The elegant wood and stone entry vestibule leads to an intimate yet grandly detailed oval lobby with fluted walls and a backlit onyx fireplace. An unforgettable first impression for a spectacular address.”
          - paragraph [ref=e90]: Achille Salvagni
          - paragraph [ref=e91]: Lobby & Cinema Design
